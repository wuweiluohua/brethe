name: release

# 仅手动触发：在 Actions 页面选择 "Run workflow"。
# 触发前请确保：
#   1. 已在仓库 Settings → Secrets 配齐 4 个 Secret（BREATH_RELEASE_KEYSTORE_BASE64 等）
#   2. 已在本发版中提升了 app/build.gradle.kts 的 versionName 与 versionCode
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发版版本号（如 1.0.1）。留空则自动读取 app/build.gradle.kts 的 versionName。'
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布'
        required: false
        default: 'false'

# 同一个分支的最新运行自动取消，避免堆积
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 需要 write 才能创建 GitHub Release 与 tag

jobs:
  release:
    name: Build & publish release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 与 app/build.gradle.kts 中的 compileSdk = 34 / targetSdk = 34 保持一致
      ANDROID_API_LEVEL: '34'
      ANDROID_BUILD_TOOLS: '34.0.0'
      # cmdline-tools Aug 2024 release（兼容 AGP 8.5）
      CMDLINE_TOOLS_VERSION: '11076708'

    steps:
      # GitHub Actions 的 if: 不允许引用 secrets 上下文，故首步在 env 读密钥，
      # 判断非空后输出 configured 标志；未配置则直接报错退出（手动触发应当明确失败）。
      - name: Check release configuration
        id: cfg
        env:
          KEYSTORE_B64: ${{ secrets.BREATH_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::未配置 BREATH_RELEASE_KEYSTORE_BASE64 等 Secrets，无法签名发布。请在仓库 Settings → Secrets 配齐 4 个 Secret 后重试。"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Release secrets detected — will build signed release."

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4

      # 读取 app 版本号作为发版 tag，保证 Releases 与 app 版本一致
      - name: Determine version
        id: ver
        if: steps.cfg.outputs.configured == 'true'
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          if [ -z "$VER" ] || [ -z "$CODE" ]; then
            echo "::error::无法从 app/build.gradle.kts 读取 versionName/versionCode"
            exit 1
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Release version: $VER (versionCode=$CODE, tag v$VER)"

      # 版本号更新检查：同一版本不允许重复发布
      - name: Check version not already released
        if: steps.cfg.outputs.configured == 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          EXISTS=$(git ls-remote --tags origin "refs/tags/$TAG" | wc -l)
          if [ "$EXISTS" -gt 0 ]; then
            echo "::error::Tag $TAG 已存在，说明该版本已发布。请在 app/build.gradle.kts 提升 versionName 与 versionCode 后再发版。"
            exit 1
          fi
          echo "Tag $TAG 为全新版本，允许发布。"

      - name: Set Android SDK path
        if: steps.cfg.outputs.configured == 'true'
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

      - name: Set up JDK 17 (Temurin)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        if: steps.cfg.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore Android SDK
        id: cache-sdk
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-platform-${{ env.ANDROID_API_LEVEL }}-buildtools-${{ env.ANDROID_BUILD_TOOLS }}-cmdline-${{ env.CMDLINE_TOOLS_VERSION }}-${{ hashFiles('**/build.gradle.kts', '**/app/build.gradle.kts') }}
          restore-keys: |
            android-sdk-platform-${{ env.ANDROID_API_LEVEL }}-
            android-sdk-platform-

      - name: Install Android SDK (cmdline-tools + platforms + build-tools)
        if: steps.cfg.outputs.configured == 'true' && steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q cmdline-tools.zip
          rm -f cmdline-tools.zip
          rm -rf latest
          if [ -d cmdline-tools ]; then
            mv cmdline-tools latest
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Write local.properties
        if: steps.cfg.outputs.configured == 'true'
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      # 从 Secret 还原 release 钥匙（base64 编码的 keystore 文件）
      - name: Reconstruct release keystore
        if: steps.cfg.outputs.configured == 'true'
        run: echo "${{ secrets.BREATH_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks

      - name: Make gradlew executable
        if: steps.cfg.outputs.configured == 'true'
        run: chmod +x ./gradlew

      # 用 -P 注入签名密码（与 app/build.gradle.kts 的 releaseProp() 对应）
      - name: Assemble release APK + AAB
        if: steps.cfg.outputs.configured == 'true'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace -PBREATH_RELEASE_STORE_PASSWORD="${{ secrets.BREATH_RELEASE_STORE_PASSWORD }}" -PBREATH_RELEASE_KEY_ALIAS="${{ secrets.BREATH_RELEASE_KEY_ALIAS }}" -PBREATH_RELEASE_KEY_PASSWORD="${{ secrets.BREATH_RELEASE_KEY_PASSWORD }}"

      # 发布到 GitHub Releases：创建 tag 并上传 APK / AAB
      - name: Publish to GitHub Releases
        if: steps.cfg.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: BreathTrainer ${{ steps.ver.outputs.version }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### 🫁 BreathTrainer Release CI 结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.cfg.outputs.configured }}" = "true" ]; then
            echo "- Release: ${{ steps.ver.outputs.tag }} → ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Release: skipped (secrets not configured)" >> $GITHUB_STEP_SUMMARY
          fi
