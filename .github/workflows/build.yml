name: build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# 同一个分支的最新运行自动取消，避免堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build & verify (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 与 app/build.gradle.kts 中的 compileSdk = 34 / targetSdk = 34 保持一致
          api-level: 34
          build-tools-version: 34.0.0
          # 强制使用 project 的 local.properties（如有）覆盖
          force-skip-sdkmanager: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show Gradle / JDK version
        run: |
          ./gradlew --version
          java -version

      - name: Assemble debug APK
        id: assembleDebug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run lint (warnings only, 不阻断构建)
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: breath-trainer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "### 🫁 BreathTrainer CI 结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ steps.assembleDebug.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint:  ${{ steps.lint.outcome }}" >> $GITHUB_STEP_SUMMARY